name: MycoMetrics Data Pipeline & CI/CD Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Force full data reload and dbt full refresh'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-pipeline:
    name: Build, Test, Transform & Reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest tests/unit/ -v --tb=short

      - name: Execute Raw Ingestion & Fingerprinting
        run: |
          python scripts/run_pipeline.py --stage ingest --no-alerts

      - name: Execute dbt Transformations
        run: |
          python scripts/run_pipeline.py --stage dbt_run --no-alerts

      - name: Execute dbt Test Assertions (87 Checks)
        run: |
          python scripts/run_pipeline.py --stage dbt_test --no-alerts

      - name: Execute Multi-Tier Financial & Mass Balance Reconciliation
        run: |
          python scripts/run_pipeline.py --stage reconcile --no-alerts

      - name: Run End-to-End Integration Tests
        run: |
          pytest tests/integration/ -v --tb=short

      - name: Stage Power BI Semantic Model Data
        run: |
          python scripts/run_pipeline.py --stage export --no-alerts

      - name: Execute Statistical EDA & Publication Figures
        run: |
          python scripts/run_pipeline.py --stage stats --no-alerts

      - name: Upload Pipeline Audit Logs & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-audit-and-figures
          path: |
            logs/pipeline_runs/
            data/audit_logs/alerts/
            docs/figures/
            powerbi/data/tables_manifest.json
          retention-days: 14
