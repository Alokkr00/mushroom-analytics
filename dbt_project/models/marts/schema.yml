version: 2

models:
  - name: dim_customer
    description: "Customer dimensional model enriched with lifetime RFM aggregations, tenure, and repeat status."
    columns:
      - name: customer_id
        description: "Primary key for customer dimension."
        tests:
          - unique
          - not_null
      - name: customer_segment
        description: "Customer classification: Restaurant, Wholesale, Supermarket, Farmer Market, Direct Retail."
        tests:
          - not_null
      - name: is_active
        tests:
          - not_null

  - name: dim_mushroom
    description: "Mushroom variety reference dimension with biological lifecycle parameters."
    columns:
      - name: mushroom_id
        description: "Primary key for mushroom variety."
        tests:
          - unique
          - not_null
      - name: mushroom_common_name
        tests:
          - not_null

  - name: dim_product
    description: "Product catalog dimension with SKU packaging format, unit weight, and standard price."
    columns:
      - name: product_id
        description: "Primary key for product dimension."
        tests:
          - unique
          - not_null
      - name: sku_code
        tests:
          - unique
          - not_null
      - name: mushroom_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_mushroom')
              field: mushroom_id

  - name: dim_date
    description: "Standard calendar date dimension covering historical and operational timeframe."
    columns:
      - name: date_key
        description: "Primary key date."
        tests:
          - unique
          - not_null

  - name: dim_supplier
    description: "Supplier dimension with reliability rating and contact details."
    columns:
      - name: supplier_id
        tests:
          - unique
          - not_null

  - name: dim_expense_category
    description: "Expense classification categories for operating cost allocation."
    columns:
      - name: category_id
        tests:
          - unique
          - not_null

  - name: dim_location
    description: "Growing rooms, incubation chambers, and storage facilities."
    columns:
      - name: location_id
        tests:
          - unique
          - not_null

  - name: fact_production_batches
    description: "Cultivation batch fact table tracking biological efficiency, cycles, yields, and direct costs."
    columns:
      - name: batch_id
        description: "Primary key batch identifier."
        tests:
          - unique
          - not_null
      - name: mushroom_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_mushroom')
              field: mushroom_id
      - name: location_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_id

  - name: fact_harvest
    description: "Individual harvest flushes tracking gross yield, accepted weight, and rejections."
    columns:
      - name: harvest_id
        tests:
          - unique
          - not_null
      - name: batch_id
        tests:
          - not_null
          - relationships:
              to: ref('fact_production_batches')
              field: batch_id

  - name: fact_sales
    description: "Sales order line grain fact table tracking fulfillment, recognized revenue, COGS, and gross margin."
    columns:
      - name: order_line_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: mushroom_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_mushroom')
              field: mushroom_id

  - name: fact_expenses
    description: "Operating expense transactions for overhead, labor, and utility analysis."
    columns:
      - name: expense_id
        tests:
          - unique
          - not_null
      - name: category_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_expense_category')
              field: category_id

  - name: fact_procurement
    description: "Purchases of raw materials, spawn, substrate, and packaging supplies."
    columns:
      - name: purchase_id
        tests:
          - unique
          - not_null
      - name: supplier_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_supplier')
              field: supplier_id

  - name: fact_inventory_movements
    description: "Inventory audit log tracking pack-in receipts, sales dispatches, and shrinkage."
    columns:
      - name: movement_id
        tests:
          - unique
          - not_null

  - name: mart_business_overview
    description: "Monthly executive summary mart reconciling net revenue, COGS, gross margin, OPEX, and net operating result."
    columns:
      - name: year_month
        tests:
          - unique
          - not_null

  - name: mart_customer_analysis
    description: "Customer lifetime value, Pareto 80/20 tiering, and concentration ranking."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_revenue_rank
        tests:
          - unique
          - not_null
