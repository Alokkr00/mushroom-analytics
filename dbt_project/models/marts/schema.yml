version: 2

models:
  - name: mart_business_overview
    description: "Monthly executive summary mart reconciling net revenue, COGS, gross margin, OPEX, and net operating result."
    columns:
      - name: year_month
        tests:
          - unique
          - not_null

  - name: mart_customer_analysis
    description: "Customer lifetime value, Pareto 80/20 tiering, and concentration ranking."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_revenue_rank
        tests:
          - unique
          - not_null

  - name: mart_production_performance
    description: "Production performance mart aggregating batch volume, biological efficiency, and harvest metrics."

  - name: mart_sales_profitability
    description: "Sales profitability mart tracking product margins, wholesale discounting, and channel economics."

  - name: mart_inventory_waste
    description: "Inventory waste and spoilage mart tracking biomass shrinkage and desiccation."
